<form method="post" action="{% url 'main:toggle_star_project' project.id %}" class="star-form">
  {% csrf_token %}
  <button type="submit"
    class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
    title="{% if project.starred_by.all %}
      Dibintangi oleh {{ project.starred_by.all|join:', ' }}
    {% else %}
      Jadilah yang pertama memberi star
    {% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
    </svg>
    <span class="star-label">
      {% if user in project.starred_by.all %}
        Unstar
      {% else %}
        Star
      {% endif %}
    </span>
    <span class="star-count">{{ project.starred_by.count }}</span>
  </button>
</form>
