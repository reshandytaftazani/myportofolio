<aside class="desktop-calendar-widget" aria-label="Tanggal Jakarta">
  <span data-calendar-weekday>Jakarta</span>
  <time data-calendar-date>{% now 'j' %}</time>
  <p data-calendar-month>{% now 'F Y' %}</p>
  <div class="desktop-calendar-week" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="desktop-calendar-days" data-calendar-days aria-hidden="true"></div>
</aside>
