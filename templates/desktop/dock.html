  <span class="dock-divider" aria-hidden="true"></span>

    <span class="dock-label" aria-hidden="true">GitHub</span>
    <span class="dock-indicator" aria-hidden="true"></span>

  <a href="https://www.linkedin.com/in/reshandy-taftazani-aulya/" data-dock-link="linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">

    <span class="dock-label" aria-hidden="true">LinkedIn</span>
    <span class="dock-indicator" aria-hidden="true"></span>
  </a>
  <a href="mailto:reshandytaftazaniaulya@gmail.com" data-dock-link="email" aria-label="Email">
